<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Wave Rider Nusantara — Rust</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { display: grid; place-items: center; }
      canvas { width: 100vw; height: 100vh; display: block; outline: none; }
      #startup-status { position: fixed; z-index: 5; inset: auto 12px 12px; padding: 12px 14px; border: 1px solid #666; border-radius: 8px; background: #171717; color: #fff; font: 14px/1.45 system-ui, sans-serif; overflow-wrap: anywhere; }
      #startup-status[hidden] { display: none; }
      #startup-status strong { display: block; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1" aria-label="Wave Rider Nusantara game"></canvas>
    <div id="startup-status" role="status" aria-live="polite">
      <strong>Wave Rider Nusantara — startup diagnostic build</strong>
      Diagnostic build 82b98c0 is loaded. Waiting for the Rust WebAssembly game to initialize…
    </div>
    <script>
      (() => {
        const status = document.getElementById("startup-status");
        let failed = false;
        function showError(title, detail) {
          failed = true;
          status.dataset.phase = "failed";
          status.dataset.failed = "true";
          status.hidden = false;
          status.innerHTML = "";
          const heading = document.createElement("strong");
          heading.textContent = title;
          const message = document.createElement("div");
          message.textContent = detail || "No additional error details were provided.";
          status.append(heading, message);
        }
        const originalConsoleError = console.error.bind(console);
        console.error = (...args) => {
          originalConsoleError(...args);
          const detail = args.map((value) => {
            try { return typeof value === "string" ? value : JSON.stringify(value); }
            catch { return String(value); }
          }).join(" ");
          if (/panicked at|panicked:|panicked with/i.test(detail)) showError("Rust panic details", detail);
        };
        window.addEventListener("error", (event) => {
          const heading = status.querySelector("strong");
          if (heading && heading.textContent === "Rust panic details") return;
          showError("Game startup error", event.message || "A script or WebAssembly resource failed to load.");
        });
        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          showError("Game startup error", reason && reason.message ? reason.message : String(reason || "Unhandled promise rejection"));
        });
        const testCanvas = document.createElement("canvas");
        const gl = testCanvas.getContext("webgl2") || testCanvas.getContext("webgl");
        if (!gl) {
          showError("WebGL is unavailable", "Firefox could not create a WebGL context. Check Firefox settings, device graphics support, and hardware acceleration.");
        }
        // Start the watchdog immediately. Waiting for the window "load" event can
        // leave the original message stuck if the loader stalls before that event.
        let wasmStage = "loader not started";
        let wasmError = "";
        const wasmApi = window.WebAssembly;
        if (wasmApi) {
          for (const method of ["instantiate", "instantiateStreaming", "compile", "compileStreaming"]) {
            if (typeof wasmApi[method] !== "function") continue;
            const original = wasmApi[method].bind(wasmApi);
            wasmApi[method] = (...args) => {
              wasmStage = method + " called";
              let result;
              try {
                result = original(...args);
              } catch (error) {
                wasmError = method + ": " + (error && error.message ? error.message : String(error));
                wasmStage = method + " threw";
                throw error;
              }
              if (result && typeof result.then === "function") {
                return result.then(
                  value => { wasmStage = method + " succeeded"; return value; },
                  error => {
                    wasmError = method + ": " + (error && error.message ? error.message : String(error));
                    wasmStage = method + " rejected";
                    throw error;
                  }
                );
              }
              wasmStage = method + " succeeded";
              return result;
            };
          }
        }
        window.setTimeout(() => {
          if (!failed && status.dataset.phase !== "running" && !status.hidden) {
            const canvas = document.getElementById("glcanvas");
            const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
            const detail = [
              "The page loaded, but the game did not finish initializing within 12 seconds.",
              "WASM stage: " + wasmStage + ".",
              "WebAssembly API: " + (wasmApi ? "available" : "unavailable") + ".",
              "Canvas: " + canvas.width + "×" + canvas.height + ".",
              "WebGL context: " + (gl ? "available" : "unavailable") + ".",
              wasmError ? "Last WASM error: " + wasmError : "No WebAssembly API error was captured."
            ].join(" ");
            showError("WebAssembly startup timed out — diagnostic details", detail);
          }
        }, 12000);
      })();
    </script>
    <script src="./mq_js_bundle.js" onerror="document.getElementById('startup-status').hidden=false;document.getElementById('startup-status').textContent='Could not load the Macroquad JavaScript loader (mq_js_bundle.js).';"></script>
    <script>
      (async () => {
        const status = document.getElementById("startup-status");
        const showFailure = (title, detail) => {
          status.dataset.phase = "failed";
          status.dataset.failed = "true";
          status.dataset.phase = "failed";
          status.hidden = false;
          status.replaceChildren();
          const heading = document.createElement("strong");
          heading.textContent = title;
          const message = document.createElement("div");
          message.textContent = detail;
          status.append(heading, message);
        };
        const requiredFiles = [
          "./wave_rider_nusantara.wasm",
          "./assets/images/bg.webp",
          "./assets/images/gatot-1.webp",
          "./assets/images/gatot-2.webp",
          "./assets/images/gatot-hit.webp",
          "./assets/images/gatot-collect.webp",
          "./assets/images/bomb.webp",
          "./assets/images/collect-1.webp",
          "./assets/images/collect-2.webp",
          "./assets/images/collect-3.webp",
          "./assets/images/collect-4.webp",
          "./assets/fonts/OpenSans-SemiBold.ttf"
        ];
        try {
          status.hidden = false;
          status.dataset.phase = "checking";
          status.replaceChildren();
          const heading = document.createElement("strong");
          heading.textContent = "Wave Rider Nusantara — startup diagnostic build";
          const message = document.createElement("div");
          message.textContent = "Checking WebAssembly and game assets…";
          status.append(heading, message);

          const checks = await Promise.all(requiredFiles.map(async (path) => {
            try {
              const isWasm = path.endsWith(".wasm");
              const response = await fetch(path, { method: isWasm ? "GET" : "HEAD", cache: "no-store" });
              if (!response.ok) return path + " returned HTTP " + response.status;
              if (isWasm) {
                const bytes = await response.arrayBuffer();
                if (bytes.byteLength < 8) return path + " is empty or too small (" + bytes.byteLength + " bytes)";
                const magic = new Uint8Array(bytes.slice(0, 4));
                if (magic[0] !== 0 || magic[1] !== 97 || magic[2] !== 115 || magic[3] !== 109) {
                  return path + " did not return a valid WebAssembly file";
                }
              }
              return null;
            } catch (error) {
              return path + " failed: " + (error && error.message ? error.message : String(error));
            }
          }));
          const failures = checks.filter(Boolean);
          if (failures.length) {
            showFailure("Required game files failed to load", failures.join(" | "));
            return;
          }
          if (typeof load !== "function") {
            showFailure("Macroquad loader unavailable", "mq_js_bundle.js loaded without defining load(). Check the loader file and its response.");
            return;
          }
          message.textContent = "All required files responded successfully. Starting the Rust WebAssembly game…";
          status.dataset.phase = "starting";
          // Capture the context Macroquad itself requests. Never create a context
          // here: getContext() fixes the canvas to that type, so asking for WebGL2
          // first can make Macroquad's WebGL1 initialization fail.
          const canvas = document.getElementById("glcanvas");
          let renderDetected = false;
          const watchedPrototypes = new WeakSet();
          const originalGetContext = canvas.getContext.bind(canvas);
          function watchDrawCalls(context) {
            const prototype = Object.getPrototypeOf(context);
            if (watchedPrototypes.has(prototype)) return;
            watchedPrototypes.add(prototype);
            for (const method of ["drawArrays", "drawElements"]) {
              const originalDraw = prototype[method];
              if (typeof originalDraw !== "function") continue;
              try {
                Object.defineProperty(prototype, method, {
                  configurable: true,
                  writable: true,
                  value: function (...drawArgs) {
                    if (this.canvas === canvas && !renderDetected && status.dataset.phase !== "failed") {
                      renderDetected = true;
                      status.dataset.phase = "running";
                      status.hidden = true;
                    }
                    return originalDraw.apply(this, drawArgs);
                  }
                });
              } catch (error) {
                // Keep the watchdog active if the browser protects native methods.
              }
            }
          }
          canvas.getContext = (type, ...args) => {
            const context = originalGetContext(type, ...args);
            if (context && (type === "webgl" || type === "webgl2")) watchDrawCalls(context);
            return context;
          };
          load("./wave_rider_nusantara.wasm");
          }
          load("./wave_rider_nusantara.wasm");
          window.requestAnimationFrame(detectRenderedFrame);
        } catch (error) {
          showFailure("Could not start WebAssembly", error && error.message ? error.message : String(error));
        }
      })();
    </script>
  </body>
</html>
