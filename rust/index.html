<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Wave Rider Nusantara — Rust</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { display: grid; grid-template-rows: minmax(0, 1fr) 150px; }
      canvas { width: 100%; height: 100%; min-height: 0; display: block; outline: none; touch-action: none; -webkit-tap-highlight-color: transparent; transform: scaleY(-1); transform-origin: center; image-rendering: auto; backface-visibility: hidden; }
      #game-controls { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 12px calc(4px + env(safe-area-inset-bottom)); background: #000; border-top: 1px solid #383838; touch-action: none; }
      #game-controls .control-row { display: flex; justify-content: center; }
      #game-controls button { width: 60px; height: 60px; margin: 2px 5px; border-radius: 15px; background: rgba(0,0,0,0.7); border: 2px solid #fff; color: #fff; font: 700 24px/1 system-ui, sans-serif; display: flex; justify-content: center; align-items: center; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; padding: 0; }
      #game-controls button:active { background: rgba(255,255,255,0.25); }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1" aria-label="Wave Rider Nusantara game"></canvas>
    <nav id="game-controls" aria-label="Game movement controls">
      <button type="button" data-key="ArrowUp" data-key-code="38" aria-label="Move up">↑</button>
      <div class="control-row">
        <button type="button" data-key="ArrowLeft" data-key-code="37" aria-label="Move left">←</button>
        <button type="button" data-key="ArrowDown" data-key-code="40" aria-label="Move down">↓</button>
        <button type="button" data-key="ArrowRight" data-key-code="39" aria-label="Move right">→</button>
      </div>
    </nav>
    <script>
      // Forward held D-pad presses to the same keyboard path used by Macroquad.
      // Dispatch from the canvas so listeners attached to the canvas or window receive them.
      (() => {
        const controls = document.getElementById("game-controls");
        const canvas = document.getElementById("glcanvas");
        const activeKeys = new Set();
        // Use the same browser-native WebM soundtrack as the React version. Calling
        // play() synchronously from the trusted pointer/keyboard event avoids WebAudio
        // autoplay restrictions that can swallow a start request from the WASM frame loop.
        const music = new Audio("./assets/audio/bg-sound.ogg");
        music.loop = true;
        music.preload = "auto";
        music.volume = 0.05;
        let gameStarted = false;
        let paused = false;
        let muted = false;
        const startMusic = () => {
          if (muted) return;
          const result = music.play();
          if (result && typeof result.catch === "function") result.catch(() => {});
        };
        const pauseMusic = () => music.pause();
        const canvasGamePoint = (event) => {
          const rect = canvas.getBoundingClientRect();
          const scale = Math.min(rect.width / 800, rect.height / 600);
          if (!scale) return null;
          const ox = (rect.width - 800 * scale) / 2;
          const oy = (rect.height - 600 * scale) / 2;
          return { x: (event.clientX - rect.left - ox) / scale, y: 600 - (event.clientY - rect.top - oy) / scale };
        };
        canvas.addEventListener("pointerdown", (event) => {
          const point = canvasGamePoint(event);
          if (!point) return;
          if (!gameStarted && point.x >= 300 && point.x <= 500 && point.y >= 372 && point.y <= 426) {
            gameStarted = true;
            paused = false;
            startMusic();
          } else if (point.x >= 670 && point.x <= 782 && point.y >= 18 && point.y <= 52) {
            muted = !muted;
            if (muted) pauseMusic(); else if (gameStarted && !paused) startMusic();
          } else if (gameStarted && point.x >= 570 && point.x <= 658 && point.y >= 18 && point.y <= 52) {
            paused = !paused;
            if (paused) pauseMusic(); else startMusic();
          } else if (paused && point.x >= 250 && point.x <= 390 && point.y >= 320 && point.y <= 364) {
            paused = false;
            startMusic();
          } else if (paused && point.x >= 410 && point.x <= 550 && point.y >= 320 && point.y <= 364) {
            paused = false;
            gameStarted = false;
            pauseMusic();
          } else if (gameStarted && point.y >= 320 && point.y <= 364 && point.x >= 250 && point.x <= 390) {
            paused = false;
            startMusic();
          }
        });
        window.addEventListener("keydown", (event) => {
          if (event.code === "Space" && !gameStarted) { gameStarted = true; paused = false; startMusic(); }
          if (event.code === "KeyP" && gameStarted) { paused = !paused; if (paused) pauseMusic(); else startMusic(); }
          if (event.code === "KeyM") { muted = !muted; if (muted) pauseMusic(); else if (gameStarted && !paused) startMusic(); }
          if (event.code === "KeyR" && gameStarted) { gameStarted = false; paused = false; pauseMusic(); }
        });
        const emit = (button, type) => {
          const key = button.dataset.key;
          const keyCode = Number(button.dataset.keyCode);
          canvas.dispatchEvent(new KeyboardEvent(type, {
            key, code: key, keyCode, which: keyCode, bubbles: true, cancelable: true
          }));
        };
        const release = (button) => {
          const key = button.dataset.key;
          if (!key || !activeKeys.has(key)) return;
          activeKeys.delete(key);
          emit(button, "keyup");
        };
        controls.querySelectorAll("button[data-key]").forEach((button) => {
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            const key = button.dataset.key;
            if (!activeKeys.has(key)) {
              activeKeys.add(key);
              emit(button, "keydown");
            }
            try { button.setPointerCapture(event.pointerId); } catch {}
          });
          button.addEventListener("pointerup", () => release(button));
          button.addEventListener("pointerleave", () => release(button));
          button.addEventListener("pointercancel", () => release(button));
          button.addEventListener("lostpointercapture", () => release(button));
          button.addEventListener("contextmenu", (event) => event.preventDefault());
        });
        window.addEventListener("blur", () => {
          controls.querySelectorAll("button[data-key]").forEach(release);
        });
      })();
    </script>
    <script>
      // Prevent mobile browser gestures from stealing taps intended for the game.
      document.getElementById("glcanvas").addEventListener("touchstart", (event) => {
        event.preventDefault();
      }, { passive: false });
    </script>
    <script src="./mq_js_bundle.js"></script>
    <script>
      // Start the OGG soundtrack directly inside the user's trusted gesture so
      // mobile browsers do not reject playback from an asynchronous WASM callback.
      (() => {
        const canvas = document.getElementById("glcanvas");
        const music = new Audio("./assets/audio/bg-sound.ogg");
        music.loop = true;
        music.preload = "auto";
        music.volume = 0.05;
        let started = false;
        let paused = false;
        let muted = false;
        const play = () => {
          if (muted) return;
          const promise = music.play();
          if (promise && promise.catch) promise.catch(() => {});
        };
        const stop = () => music.pause();
        const pointFromEvent = (event) => {
          const rect = canvas.getBoundingClientRect();
          const scale = Math.min(rect.width / 800, rect.height / 600);
          if (!scale) return null;
          const ox = (rect.width - 800 * scale) / 2;
          const oy = (rect.height - 600 * scale) / 2;
          return { x: (event.clientX - rect.left - ox) / scale, y: 600 - (event.clientY - rect.top - oy) / scale };
        };
        canvas.addEventListener("pointerdown", (event) => {
          const p = pointFromEvent(event);
          if (!p) return;
          if (!started && p.x >= 280 && p.x <= 520 && p.y >= 360 && p.y <= 440) {
            started = true;
            paused = false;
            play();
          } else if (p.x >= 660 && p.x <= 790 && p.y >= 12 && p.y <= 58) {
            muted = !muted;
            music.muted = muted;
            if (!muted && started && !paused) play();
          } else if (started && p.x >= 560 && p.x <= 665 && p.y >= 12 && p.y <= 58) {
            paused = !paused;
            if (paused) stop(); else play();
          } else if (paused && p.y >= 300 && p.y <= 390) {
            paused = false;
            play();
          }
        });
        window.addEventListener("keydown", (event) => {
          if (event.code === "Space" && !started) { started = true; paused = false; play(); }
          if (event.code === "KeyP" && started) { paused = !paused; if (paused) stop(); else play(); }
          if (event.code === "KeyM") { muted = !muted; music.muted = muted; if (!muted && started && !paused) play(); }
          if (event.code === "KeyR" && started) { started = false; paused = false; stop(); }
        });
        const status = document.createElement("div");
        status.hidden = true;
        status.setAttribute("aria-live", "off");
        document.body.append(status);
        if (typeof load === "function") load("./wave_rider_nusantara.wasm");
      })();
    </script>
  </body>
</html>
