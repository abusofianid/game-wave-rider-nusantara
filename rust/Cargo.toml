[package]
name = "wave-rider-nusantara"
version = "0.2.0"
edition = "2024"
description = "A native desktop Rust endless runner built with GPUI"
license = "MIT OR Apache-2.0"

[dependencies]
gpui-unofficial = "1.27.0"
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.27.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
