[package]
name = "wave-rider-nusantara"
version = "0.1.0"
edition = "2021"
description = "A Rust port of Wave Rider Nusantara using Macroquad"
license = "MIT OR Apache-2.0"

[dependencies]
macroquad = "0.4.14"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
