name: Native Rust GPUI checks

on:
  push:
    branches: [rust, gpui-from-python]
    paths:
      - "rust/**"
      - ".github/workflows/rust-check.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Format Rust sources
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit formatting on branch pushes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rust/src
            git commit -m "Format native GPUI Rust sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Check native application
        run: cargo check --manifest-path rust/Cargo.toml
      - name: Run gameplay unit tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build release desktop app
        run: cargo build --manifest-path rust/Cargo.toml --release
