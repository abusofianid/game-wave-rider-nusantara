name: Native Rust GPUI checks

on:
  push:
    branches: [rust, native-gpui]
    paths:
      - "rust/**"
      - ".github/workflows/rust-check.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev
      - name: Check native GPUI application
        run: cargo check --manifest-path rust/Cargo.toml
      - name: Run unit tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build release application
        run: cargo build --manifest-path rust/Cargo.toml --release
