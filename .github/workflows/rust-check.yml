name: Native Rust GPUI checks

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libfontconfig1-dev \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Verify formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Check native application
        run: cargo check --manifest-path rust/Cargo.toml
      - name: Run gameplay unit tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build release desktop app
        run: cargo build --manifest-path rust/Cargo.toml --release
