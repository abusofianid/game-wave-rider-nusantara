name: Native Rust GPUI checks

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libfontconfig1-dev \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            xvfb \
            xauth \
            openbox \
            imagemagick \
            libvulkan1 \
            mesa-vulkan-drivers
      - name: Verify formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Check native application
        run: cargo check --manifest-path rust/Cargo.toml
      - name: Run gameplay unit tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build release desktop app
        run: cargo build --manifest-path rust/Cargo.toml --release
      - name: Smoke test GPUI startup and capture screenshot
        run: |
          mkdir -p artifacts
          xvfb-run -a bash -euo pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            openbox >/tmp/wave-rider-openbox.log 2>&1 &
            wm_pid=$!
            ./rust/target/release/wave-rider-nusantara >/tmp/wave-rider-app.log 2>&1 &
            app_pid=$!
            cleanup() {
              kill "$app_pid" "$wm_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
              wait "$wm_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            for attempt in $(seq 1 30); do
              if grep -q "image ready: .*assets/images/bg.png" /tmp/wave-rider-app.log; then
                break
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat /tmp/wave-rider-app.log
                echo "GPUI process exited before the background image loaded"
                exit 1
              fi
              sleep 1
            done
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/wave-rider-app.log
              echo "GPUI process exited before the startup check completed"
              exit 1
            fi
            import -window root artifacts/gpui-desktop-smoke.png
            dimensions=$(identify -format "%wx%h" artifacts/gpui-desktop-smoke.png)
            colors=$(identify -format "%k" artifacts/gpui-desktop-smoke.png)
            echo "Captured virtual desktop: $dimensions; distinct colors: $colors"
            test "$dimensions" = "1280x1024"
            test "$colors" -gt 8
            if ! grep -q "image ready: .*assets/images/bg.png" /tmp/wave-rider-app.log; then
              echo "The original background image did not finish loading within 30 seconds"
              cat /tmp/wave-rider-app.log
              exit 1
            fi
            for asset in gatot_1.png bomb.png collect_1.png; do
              if ! grep -q "image ready: .*assets/images/$asset" /tmp/wave-rider-app.log; then
                echo "Required game sprite did not finish loading: $asset"
                cat /tmp/wave-rider-app.log
                exit 1
              fi
            done
          '
      - name: Upload GPUI smoke-test screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-desktop-smoke
          path: |
            artifacts/gpui-desktop-smoke.png
            /tmp/wave-rider-app.log
            /tmp/wave-rider-openbox.log
          if-no-files-found: warn
          retention-days: 7
